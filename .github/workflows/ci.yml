name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  # Builds and tests the code on a runner with an older Xcode. The on-device AI code is compiled
  # out there (its framework needs the macOS 26 SDK), so this job checks everything else.
  # (macOS 14 runners were often not available any more, so this uses macOS 15.)
  build-and-test:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Check shell scripts parse
        run: |
          for f in Install.command init/setup.sh scripts/*.sh; do
            bash -n "$f" && echo "ok  $f"
          done

      - name: Build (debug)
        run: swift build

      - name: Run unit tests
        run: |
          set +e
          swift test 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Failures as annotations, so they can be read without the full log.
            grep -E "error:|: failed|Test Case .* failed" test-output.txt | head -50 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit "$status"

  # Builds the Windows app, runs the tests, and exercises it on a real Windows machine:
  # a start-up check, a real keyboard-and-mouse record/replay self-test, and screenshots of every screen.
  windows-build-and-test:
    runs-on: windows-latest
    permissions:
      contents: write   # only used to publish screenshots to the ci-screenshots branch on pushes to main
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Toolchain info
        shell: pwsh
        run: |
          dotnet --info
          [System.Environment]::OSVersion | Format-List
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::AllScreens | Format-List DeviceName, Bounds, Primary

      - name: Build libraries and tests
        shell: pwsh
        run: dotnet build windows/tests/ActionRecorder.Tests -c Release -warnaserror

      - name: Run tests
        shell: pwsh
        run: |
          $out = & dotnet windows/tests/ActionRecorder.Tests/bin/Release/net8.0/ActionRecorder.Tests.dll 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            # Failures as annotations, so they can be read without the full log.
            $out | Select-String -Pattern '^\s*FAIL' -Context 0,1 | ForEach-Object {
              Write-Host ("::error::" + $_.Line.Trim() + " :: " + (($_.Context.PostContext | ForEach-Object { $_.Trim() }) -join ' '))
            }
          }
          exit $code

      - name: Publish the app
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { '0.0.0-ci' }
          $numeric = if ($version -match '^\d+\.\d+\.\d+') { $Matches[0] } else { '0.0.0' }
          "AR_VERSION=$numeric" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          dotnet publish windows/src/ActionRecorder.App -c Release -r win-x64 --self-contained true `
            -p:PublishReadyToRun=true -p:Version=$numeric -o windows/artifacts/publish
          Get-ChildItem windows/artifacts/publish | Measure-Object -Property Length -Sum | ForEach-Object { "{0} files, {1:N1} MB" -f $_.Count, ($_.Sum / 1MB) }

      - name: Start-up check (--smoke)
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'ar-smoke'
          New-Item -ItemType Directory -Force $data | Out-Null
          $env:ACTION_RECORDER_DATA = $data
          $out = Join-Path $env:RUNNER_TEMP 'smoke.txt'
          $p = Start-Process windows/artifacts/publish/ActionRecorder.exe -ArgumentList '--smoke','--out',$out -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Host "::error title=smoke::timed out" }
          if (Test-Path $out) { Get-Content $out } else { Write-Host "::error title=smoke::no report written" }
          if (Test-Path $out) { Get-Content $out | ForEach-Object { if ($_ -like 'FAIL*') { Write-Host "::error title=smoke::$_" } elseif ($_ -like 'PASS*') { Write-Host "::notice title=smoke::$_" } } }
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Real input self-test (--selftest)
        id: selftest
        continue-on-error: true
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'ar-selftest'
          New-Item -ItemType Directory -Force $data | Out-Null
          $env:ACTION_RECORDER_DATA = $data
          $out = Join-Path $env:RUNNER_TEMP 'selftest.txt'
          $p = Start-Process windows/artifacts/publish/ActionRecorder.exe -ArgumentList '--selftest','--out',$out -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); Write-Host "::error title=selftest::timed out" }
          if (Test-Path $out) { Get-Content $out } else { Write-Host "::error title=selftest::no report written" }
          if (Test-Path $out) { Get-Content $out | ForEach-Object { if ($_ -like 'FAIL*') { Write-Host "::error title=selftest::$_" } elseif ($_ -like 'PASS*') { Write-Host "::notice title=selftest::$_" } } }
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Screenshots of every screen (--screenshots)
        continue-on-error: true
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'ar-shots'
          New-Item -ItemType Directory -Force $data | Out-Null
          $env:ACTION_RECORDER_DATA = $data
          $dir = Join-Path $env:GITHUB_WORKSPACE 'windows/artifacts/screenshots'
          $out = Join-Path $dir 'report.txt'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $p = Start-Process windows/artifacts/publish/ActionRecorder.exe -ArgumentList '--screenshots',$dir,'--out',$out -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); Write-Host "::error title=screenshots::timed out" }
          if (Test-Path $out) { Get-Content $out | ForEach-Object { if ($_ -like 'FAIL*') { Write-Host "::error title=screenshots::$_" } elseif ($_ -like 'PASS*') { Write-Host "::notice title=screenshots::$_" } } }
          Get-ChildItem $dir | Format-Table Name, Length

      - name: Publish screenshots to the ci-screenshots branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: pwsh
        run: |
          $src = Join-Path $env:GITHUB_WORKSPACE 'windows/artifacts/screenshots'
          if (-not (Test-Path $src)) { exit 0 }
          $work = Join-Path $env:RUNNER_TEMP 'shots-branch'
          New-Item -ItemType Directory -Force $work | Out-Null
          Copy-Item "$src/*" $work -Recurse -Force
          Set-Location $work
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Windows UI screenshots from CI run ${{ github.run_id }} (${{ github.sha }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots

      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$env:AR_VERSION" windows/installer/ActionRecorder.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Compress-Archive -Path windows/artifacts/publish/* -DestinationPath windows/artifacts/ActionRecorder-Windows-Portable.zip
          Get-ChildItem windows/artifacts -File | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: ActionRecorder-Windows
          path: |
            windows/artifacts/ActionRecorder-Windows-Setup.exe
            windows/artifacts/ActionRecorder-Windows-Portable.zip
          if-no-files-found: error

  # Builds the app the way users download it: a .dmg to drag into Applications, plus a .zip that
  # the in-app updater uses. Runs on the newest runner so the AI features are compiled in.
  package:
    runs-on: macos-26
    permissions:
      contents: write   # only used to publish screenshots to the ci-screenshots-mac branch on pushes to main
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build the app
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          else
            export VERSION="0.0.0-ci"
          fi
          ./scripts/build_app.sh
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Screenshots of the Mac screens
        continue-on-error: true
        run: |
          mkdir -p mac-shots
          "build/Mac Action Recorder.app/Contents/MacOS/MacActionRecorder" --screenshots "$PWD/mac-shots" > mac-shots/app-output.txt 2>&1 &
          pid=$!
          for i in $(seq 1 180); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          ls -la mac-shots
          cat mac-shots/report.txt || true

      - name: Make the disk image and the update zip
        run: |
          mkdir -p dist
          REQUIRE_STYLED=1 ./scripts/make_dmg.sh "build/Mac Action Recorder.app" dist/MacActionRecorder-macOS.dmg
          ditto -c -k --keepParent "build/Mac Action Recorder.app" dist/MacActionRecorder-macOS.zip
          ls -la dist

      - name: Check the disk image contents
        run: |
          hdiutil attach dist/MacActionRecorder-macOS.dmg -mountpoint /tmp/dmgcheck -nobrowse -quiet
          ls -la /tmp/dmgcheck
          test -d "/tmp/dmgcheck/Mac Action Recorder.app"
          test -L /tmp/dmgcheck/Applications
          test -f /tmp/dmgcheck/.DS_Store
          test -d /tmp/dmgcheck/.background || ls -a /tmp/dmgcheck
          codesign --verify --deep --strict "/tmp/dmgcheck/Mac Action Recorder.app"
          for s in update.sh prepare_app.sh ensure_signing_identity.sh; do
            test -f "/tmp/dmgcheck/Mac Action Recorder.app/Contents/Resources/$s"
          done
          hdiutil detach /tmp/dmgcheck -quiet

      - name: Install self-test (disk image ejecting, local signing, swap and reopen helpers)
        run: |
          set +e
          mkdir -p mac-shots
          # A throw-away keychain: on a runner nobody can answer the prompts the login keychain shows.
          export MAR_SIGNING_KEYCHAIN="$RUNNER_TEMP/selftest.keychain-db"
          export MAR_SIGNING_KEYCHAIN_PASSWORD="selftest"
          security create-keychain -p selftest "$MAR_SIGNING_KEYCHAIN"
          security set-keychain-settings "$MAR_SIGNING_KEYCHAIN"
          security unlock-keychain -p selftest "$MAR_SIGNING_KEYCHAIN"
          security list-keychains -d user -s "$MAR_SIGNING_KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          hdiutil attach dist/MacActionRecorder-macOS.dmg -quiet
          { echo "Volumes before:"; ls /Volumes; } | tee mac-shots/install-selftest-output.txt
          "build/Mac Action Recorder.app/Contents/MacOS/MacActionRecorder" --selftest-install "$RUNNER_TEMP/install-test" >> mac-shots/install-selftest-output.txt 2>&1 &
          pid=$!
          for i in $(seq 1 300); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          kill "$pid" 2>/dev/null
          wait "$pid"
          status=$?
          { echo "Exit status: $status"; echo "Volumes after:"; ls /Volumes; } >> mac-shots/install-selftest-output.txt
          cat mac-shots/install-selftest-output.txt
          cp "$RUNNER_TEMP/install-test/report.txt" mac-shots/install-selftest.txt
          exit $status

      - name: Record and replay real input in TextEdit
        continue-on-error: true
        run: |
          set +e
          mkdir -p mac-shots
          "build/Mac Action Recorder.app/Contents/MacOS/MacActionRecorder" --selftest-input "$RUNNER_TEMP/input-test" > mac-shots/input-selftest-output.txt 2>&1 &
          pid=$!
          for i in $(seq 1 150); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          kill "$pid" 2>/dev/null
          wait "$pid"
          status=$?
          echo "Exit status: $status" >> mac-shots/input-selftest-output.txt
          cat mac-shots/input-selftest-output.txt
          exit $status

      - name: Setup end-to-end (open from the disk image, install, reopen, tidy up)
        run: |
          set +e
          mkdir -p mac-shots
          export MAR_SIGNING_KEYCHAIN="$RUNNER_TEMP/selftest.keychain-db"
          export MAR_SIGNING_KEYCHAIN_PASSWORD="selftest"
          security unlock-keychain -p selftest "$MAR_SIGNING_KEYCHAIN"
          rm -rf "/Applications/Mac Action Recorder.app" 2>/dev/null || sudo rm -rf "/Applications/Mac Action Recorder.app"
          hdiutil attach dist/MacActionRecorder-macOS.dmg -quiet
          report="$PWD/mac-shots/setup-e2e.txt"
          rm -f "$report"
          "/Volumes/Mac Action Recorder/Mac Action Recorder.app/Contents/MacOS/MacActionRecorder" --selftest-setup "$report" > mac-shots/setup-e2e-first-copy.txt 2>&1 &
          for i in $(seq 1 240); do
            [ -f "$report" ] && break
            sleep 1
          done
          sleep 2
          {
            echo "== report"; cat "$report"
            echo "== volumes"; ls /Volumes
            echo "== installed app"; codesign -d -r- "/Applications/Mac Action Recorder.app" 2>&1 | tail -1
            echo "== running copies"; pgrep -fl MacActionRecorder
          } > mac-shots/setup-e2e-summary.txt 2>&1
          cat mac-shots/setup-e2e-summary.txt
          pkill -f "Mac Action Recorder.app/Contents/MacOS/MacActionRecorder" || true
          grep -q "Phase: finished" "$report" \
            && grep -q "Location: applications" "$report" \
            && grep -q "certificate leaf" mac-shots/setup-e2e-summary.txt \
            && ! ls /Volumes | grep -q "Mac Action Recorder"

      - name: Publish screenshots to the ci-screenshots-mac branch
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          [ -d mac-shots ] || exit 0
          # Only the newest commit on main publishes, so an older, slower run cannot overwrite it.
          head="$(git ls-remote "https://github.com/${{ github.repository }}.git" refs/heads/main | cut -f1)"
          if [ "$head" != "${{ github.sha }}" ]; then echo "Not the newest commit; not publishing."; exit 0; fi
          work="$RUNNER_TEMP/mac-shots-branch"
          rm -rf "$work"
          cp -R mac-shots "$work"
          cd "$work"
          git init -q -b ci-screenshots-mac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Mac UI screenshots from CI run ${{ github.run_id }} (${{ github.sha }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots-mac


      - uses: actions/upload-artifact@v4
        with:
          name: MacActionRecorder-macOS
          path: dist/*
          if-no-files-found: error

  release:
    # Publishes the .dmg and .zip to GitHub Releases when a tag such as v0.3.0 is pushed.
    # The app is ad-hoc signed and NOT notarized (no Apple Developer credentials are used here).
    # See README > "Code signing and notarization".
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-test, package, windows-build-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Optional. When this repository secret exists, the .dmg is scanned on VirusTotal and the
      # result VirusTotal returns is added to the release notes. Without it the step is skipped.
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: MacActionRecorder-macOS
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: ActionRecorder-Windows
          path: dist

      - name: Checksums (one list for the Mac and Windows files)
        run: |
          cd dist
          ls -la
          sha256sum MacActionRecorder-macOS.dmg MacActionRecorder-macOS.zip ActionRecorder-Windows-Setup.exe ActionRecorder-Windows-Portable.zip | tee SHA256SUMS.txt

      - name: VirusTotal scan (only if the VT_API_KEY secret is set)
        if: env.VT_API_KEY != ''
        run: python3 scripts/ci/virustotal_scan.py dist/MacActionRecorder-macOS.dmg vt_result.md

      - name: Write the release notes
        run: |
          {
            echo '> [!CAUTION]'
            echo '> **macOS will block the app the first time you open it.** It will say "Apple could not verify Mac Action Recorder is free of malware". This is expected: the app is not notarized by Apple. Click **Done** (not Move to Trash), then open **System Settings > Privacy & Security** and click **Open Anyway**. Or run `xattr -dr com.apple.quarantine "/Applications/Mac Action Recorder.app"` in Terminal.'
            echo
            echo '> [!CAUTION]'
            echo '> **Windows SmartScreen will warn you the first time you run the installer.** It will say "Windows protected your PC" because the installer is not code-signed (a certificate costs money). This is expected. Click **More info**, then **Run anyway**. You can compare the file with `SHA256SUMS.txt` first.'
            echo
            echo '**Install on a Mac:** under *Assets* below, download **`MacActionRecorder-macOS.dmg`**, open it, and drag *Mac Action Recorder* onto *Applications*. Do not download "Source code (zip)": that is the program'"'"'s source files, not the app.'
            echo
            echo '**Install on Windows 10/11 (64-bit):** download **`ActionRecorder-Windows-Setup.exe`** and run it. It installs for your user only and needs no administrator rights. `ActionRecorder-Windows-Portable.zip` is the same app without an installer.'
            echo
            echo '**Updating a Mac that already has the app:** either click **Restart to Update** in the app, or download the `.dmg`, drag the app onto *Applications* and choose **Replace**, then open it from Applications. It finishes its own setup and keeps the permissions you already switched on. (Coming from a copy that was never set up by the app itself, macOS needs the two permissions switched on one more time; after that they stay.)'
            echo
            echo "Step-by-step instructions are in the [README](https://github.com/${GITHUB_REPOSITORY}#install-on-a-mac-no-xcode-needed). \`MacActionRecorder-macOS.zip\` is the same app, used by the in-app updater."
            echo
            # What's new: this version's section of CHANGELOG.md.
            version="${GITHUB_REF_NAME#v}"
            awk -v head="## $version" '$0 == head { found = 1; next } /^## / { if (found) exit } found' CHANGELOG.md > changes.md
            if [ -s changes.md ]; then
              echo "## What's new in $version"
              cat changes.md
              echo
            fi
            if [ -f vt_result.md ]; then
              cat vt_result.md
              echo
            else
              echo "No VirusTotal scan was run for this release. See the README section \"Is it safe?\" for how to check the files yourself."
              echo
            fi
            echo "Checksums are in \`SHA256SUMS.txt\`."
          } > release_body.md
          cat release_body.md

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MacActionRecorder-macOS.dmg
            dist/MacActionRecorder-macOS.zip
            dist/ActionRecorder-Windows-Setup.exe
            dist/ActionRecorder-Windows-Portable.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
          body_path: release_body.md
