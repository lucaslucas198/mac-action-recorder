name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  # Builds and tests the code on a runner with an older Xcode. The on-device AI code is compiled
  # out there (its framework needs the macOS 26 SDK), so this job checks everything else.
  build-and-test:
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Check shell scripts parse
        run: |
          for f in Install.command init/setup.sh scripts/*.sh; do
            bash -n "$f" && echo "ok  $f"
          done

      - name: Build (debug)
        run: swift build

      - name: Run unit tests
        run: swift test

  # Builds the Windows libraries and runs their tests on a real Windows machine, so the Win32 code
  # (hooks, SendInput, hotkeys, DPI) is at least compiled and exercised by the tests where it matters.
  windows-build-and-test:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Toolchain info
        shell: pwsh
        run: |
          dotnet --info
          [System.Environment]::OSVersion | Format-List

      - name: Build libraries and tests
        shell: pwsh
        run: dotnet build windows/tests/ActionRecorder.Tests -c Release -warnaserror

      - name: Run tests
        shell: pwsh
        run: dotnet windows/tests/ActionRecorder.Tests/bin/Release/net8.0/ActionRecorder.Tests.dll

  # Builds the app the way users download it: a .dmg to drag into Applications, plus a .zip that
  # the in-app updater uses. Runs on the newest runner so the AI features are compiled in.
  package:
    needs: build-and-test
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build the app
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          else
            export VERSION="0.0.0-ci"
          fi
          ./scripts/build_app.sh
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Make the disk image and the update zip
        run: |
          mkdir -p dist
          REQUIRE_STYLED=1 ./scripts/make_dmg.sh "build/Mac Action Recorder.app" dist/MacActionRecorder-macOS.dmg
          ditto -c -k --keepParent "build/Mac Action Recorder.app" dist/MacActionRecorder-macOS.zip
          ls -la dist

      - name: Check the disk image contents
        run: |
          hdiutil attach dist/MacActionRecorder-macOS.dmg -mountpoint /tmp/dmgcheck -nobrowse -quiet
          ls -la /tmp/dmgcheck
          test -d "/tmp/dmgcheck/Mac Action Recorder.app"
          test -L /tmp/dmgcheck/Applications
          test -f /tmp/dmgcheck/.DS_Store
          test -d /tmp/dmgcheck/.background || ls -a /tmp/dmgcheck
          codesign --verify --deep --strict "/tmp/dmgcheck/Mac Action Recorder.app"
          for s in update.sh prepare_app.sh ensure_signing_identity.sh; do
            test -f "/tmp/dmgcheck/Mac Action Recorder.app/Contents/Resources/$s"
          done
          hdiutil detach /tmp/dmgcheck -quiet

      - uses: actions/upload-artifact@v4
        with:
          name: MacActionRecorder-macOS
          path: dist/*
          if-no-files-found: error

  release:
    # Publishes the .dmg and .zip to GitHub Releases when a tag such as v0.3.0 is pushed.
    # The app is ad-hoc signed and NOT notarized (no Apple Developer credentials are used here).
    # See README > "Code signing and notarization".
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Optional. When this repository secret exists, the .dmg is scanned on VirusTotal and the
      # result VirusTotal returns is added to the release notes. Without it the step is skipped.
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: MacActionRecorder-macOS
          path: dist

      - name: Checksums
        run: |
          cd dist
          sha256sum MacActionRecorder-macOS.dmg MacActionRecorder-macOS.zip | tee SHA256SUMS.txt

      - name: VirusTotal scan (only if the VT_API_KEY secret is set)
        if: env.VT_API_KEY != ''
        run: python3 scripts/ci/virustotal_scan.py dist/MacActionRecorder-macOS.dmg vt_result.md

      - name: Write the release notes
        run: |
          {
            echo '> [!CAUTION]'
            echo '> **macOS will block the app the first time you open it.** It will say "Apple could not verify Mac Action Recorder is free of malware". This is expected: the app is not notarized by Apple. Click **Done** (not Move to Trash), then open **System Settings > Privacy & Security** and click **Open Anyway**. Or run `xattr -dr com.apple.quarantine "/Applications/Mac Action Recorder.app"` in Terminal.'
            echo
            echo '**Install:** under *Assets* below, download **`MacActionRecorder-macOS.dmg`**, open it, and drag *Mac Action Recorder* onto *Applications*. Do not download "Source code (zip)": that is the program'"'"'s source files, not the app.'
            echo
            echo "Step-by-step instructions are in the [README](https://github.com/${GITHUB_REPOSITORY}#install-on-a-mac-no-xcode-needed). \`MacActionRecorder-macOS.zip\` is the same app, used by the in-app updater."
            echo
            if [ -f vt_result.md ]; then
              cat vt_result.md
              echo
            else
              echo "No VirusTotal scan was run for this release. See the README section \"Is it safe?\" for how to check the file yourself."
              echo
            fi
            echo "Checksums are in \`SHA256SUMS.txt\`."
          } > release_body.md
          cat release_body.md

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MacActionRecorder-macOS.dmg
            dist/MacActionRecorder-macOS.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
          body_path: release_body.md
